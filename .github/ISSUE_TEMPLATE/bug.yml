name: 오류 알리기
description: 쓰다가 이상한 점을 찾았어요
title: "[오류] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        알려 주셔서 고마워요. 아는 만큼만 적어 주셔도 돼요.
        **보안에 관한 문제(다른 사람의 결과를 볼 수 있다, 두 번 참여할 수 있다 등)는 여기에 공개로 올리지 말고** 저장소의 Security 탭 → Report a vulnerability 로 알려 주세요.
  - type: dropdown
    id: where
    attributes:
      label: 어느 화면인가요
      options:
        - 첫 화면 · 방 들어가기
        - 참여자 화면 (픽 카드 · 결과)
        - 방 만들기 · 진행 화면 (방장)
        - 휴대폰 리모컨
        - 큰 화면
        - 지켜보기 화면
        - 관리자 화면
        - 안내 · 약관 · 그 밖의 페이지
        - 설치 · Docker · 설정
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: 어떤 일이 있었나요
      description: 무엇을 하려다가 무엇이 어떻게 됐는지 적어 주세요. 화면 사진이 있으면 끌어다 놓아 주세요.
      placeholder: 주제를 열고 ‘지금 마감’을 눌렀는데 결과가 나오지 않았어요.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 어떻게 되길 바랐나요
  - type: textarea
    id: steps
    attributes:
      label: 다시 해 보는 방법
      description: 같은 문제를 다시 볼 수 있는 순서를 아는 대로 적어 주세요.
      placeholder: |
        1. 방을 만든다
        2. 주제 두 개를 더한다
        3. …
  - type: dropdown
    id: device
    attributes:
      label: 어떤 기기인가요
      multiple: true
      options:
        - PC (윈도우)
        - PC (맥)
        - 아이폰
        - 안드로이드 휴대폰
        - 아이패드
        - 안드로이드 태블릿
  - type: input
    id: browser
    attributes:
      label: 브라우저와 버전
      placeholder: Chrome 131, Safari 18, 삼성 인터넷 …
  - type: input
    id: version
    attributes:
      label: My Pick 버전
      description: 관리자 화면 → 한눈에 보기 → 서버 상태에 나와요.
      placeholder: 0.2.0
  - type: checkboxes
    id: checks
    attributes:
      label: 올리기 전에
      options:
        - label: 방 번호 · 비밀번호 · 입장 코드 · 지켜보기 주소 같은 것을 글과 사진에서 지웠어요
          required: true
