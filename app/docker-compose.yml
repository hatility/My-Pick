# My Pick (개발판) — 익명으로 함께 고르는 My Pick
#   1) .env.example 을 .env 로 복사하고 ADMIN_PASSWORD 등을 정해요
#   2) docker compose up -d --build   →  http://localhost:8082
#   투표: /  (휴대폰 · 태블릿은 /m 으로 넘어가요)   관리자: /admin   큰 화면: 관리자 화면의 ‘큰 화면 열기’
# 방 · 안건 · 결과 · 로고는 도커 볼륨(mypick-data)에 남아요.
# 주의: 볼륨까지 지우는 down 옵션을 쓰면 투표 기록이 모두 사라져요.
# name: 다른 프로젝트(모두 ‘개발/test’ 폴더)와 컨테이너 · 볼륨 이름이 겹치지 않게 꼭 둬요
name: my-pick
services:
  web:
    build: .
    image: my-pick:0.2.0
    ports:
      - "${PORT:-8082}:8080"
    env_file:
      - path: .env
        required: false
    volumes:
      - mypick-data:/data
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 200
    mem_limit: 512m

volumes:
  mypick-data:
